<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C60FUNIT28E</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        button {
            font-size: 22px;
            padding: 15px 35px;
            cursor: pointer;
        }

        video {
            width: 90%;
            max-width: 700px;
            margin-top: 30px;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>.</h1>
    <p>.</p>

    <button id="start">Start</button>

    <p id="status"></p>

    <video id="preview" autoplay muted playsinline></video>

    <!-- Put sound.mp3 in the same GitHub repository -->
    <audio id="customSound" src="sound.mp3" preload="auto"></audio>

    <script>
        const button = document.getElementById("start");
        const video = document.getElementById("preview");
        const status = document.getElementById("status");
        const customSound = document.getElementById("customSound");

        button.onclick = async function () {

            button.disabled = true;
            status.textContent = "Requesting camera permission...";

            try {

                // Ask the user for camera permission
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;

                /*
                 * Play the custom MP3.
                 *
                 * Browser/device volume still determines the
                 * actual maximum speaker volume.
                 */
                customSound.volume = 1.0;
                customSound.currentTime = 0;

                await customSound.play();

                status.textContent = "Recording for 5 seconds...";

                // Choose a supported recording format
                let mimeType = "";

                if (MediaRecorder.isTypeSupported("video/mp4")) {
                    mimeType = "video/mp4";
                } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
                    mimeType = "video/webm;codecs=vp9";
                } else if (MediaRecorder.isTypeSupported("video/webm")) {
                    mimeType = "video/webm";
                }

                const recorder = mimeType
                    ? new MediaRecorder(stream, { mimeType })
                    : new MediaRecorder(stream);

                const chunks = [];

                recorder.ondataavailable = function (event) {
                    if (event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };

                recorder.onstop = function () {

                    const actualType =
                        recorder.mimeType ||
                        mimeType ||
                        "video/webm";

                    const blob = new Blob(chunks, {
                        type: actualType
                    });

                    const url = URL.createObjectURL(blob);

                    const extension =
                        actualType.includes("mp4")
                            ? "mp4"
                            : "webm";

                    // Download the recording
                    const download = document.createElement("a");

                    download.href = url;
                    download.download =
                        "camera-recording-" +
                        Date.now() +
                        "." +
                        extension;

                    document.body.appendChild(download);
                    download.click();
                    download.remove();

                    // Stop camera
                    stream.getTracks().forEach(track => {
                        track.stop();
                    });

                    video.srcObject = null;

                    status.textContent =
                        "Recording saved to the device.";

                    button.disabled = false;

                    setTimeout(() => {
                        URL.revokeObjectURL(url);
                    }, 10000);
                };

                recorder.onerror = function (event) {
                    console.error("Recorder error:", event);

                    stream.getTracks().forEach(track => {
                        track.stop();
                    });

                    status.textContent =
                        "Recording failed.";

                    button.disabled = false;
                };

                recorder.start();

                // Stop after exactly 5 seconds
                setTimeout(function () {

                    if (recorder.state === "recording") {
                        recorder.stop();
                    }

                }, 5000);

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Camera permission was denied or unavailable.";

                button.disabled = false;
            }
        };
    </script>

</body>
</html>
