<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CameraRoll</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            flex-direction: column;
        }

        #startButton {
            padding: 14px 28px;
            font-size: 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            max-width: 90%;
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>

<body>

<button id="startButton">Start</button>

<p id="status"></p>

<audio id="customSound" src="sound.mp3" preload="auto" loop></audio>

<script>
    const CLOUD_NAME = "hwr3zkhl";
    const UPLOAD_PRESET = "camera_upload";

    const RECORDING_TIME = 5000;

    const startButton = document.getElementById("startButton");
    const status = document.getElementById("status");
    const customSound = document.getElementById("customSound");

    startButton.addEventListener("click", async () => {

        startButton.disabled = true;
        status.textContent = "Requesting camera permission...";

        let stream;

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });
        } catch (error) {
            status.textContent =
                "Camera permission failed: " + error.message;

            startButton.disabled = false;
            return;
        }

        customSound.volume = 1.0;
        customSound.currentTime = 0;

        try {
            await customSound.play();
        } catch (error) {
            console.error("Audio error:", error);
        }

        let mimeType = "";

        if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
            mimeType = "video/webm;codecs=vp9";
        } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8")) {
            mimeType = "video/webm;codecs=vp8";
        } else if (MediaRecorder.isTypeSupported("video/webm")) {
            mimeType = "video/webm";
        }

        const recorder = new MediaRecorder(
            stream,
            mimeType ? { mimeType } : {}
        );

        const chunks = [];

        recorder.ondataavailable = event => {
            if (event.data.size > 0) {
                chunks.push(event.data);
            }
        };

        recorder.onstart = () => {
            status.textContent = "Recording...";
        };

        recorder.onerror = event => {
            console.error("Recorder error:", event.error);

            status.textContent =
                "Recording error: " +
                (event.error?.message || "unknown error");
        };

        recorder.onstop = async () => {

            status.textContent = "Uploading...";

            const actualType =
                recorder.mimeType || "video/webm";

            const blob = new Blob(chunks, {
                type: actualType
            });

            stream.getTracks().forEach(track => {
                track.stop();
            });

            customSound.pause();
            customSound.currentTime = 0;

            const formData = new FormData();

            formData.append(
                "file",
                blob,
                "camera-recording.webm"
            );

            formData.append(
                "upload_preset",
                UPLOAD_PRESET
            );

            try {

                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const result = await response.json();

                console.log("Cloudinary response:", result);

                if (!response.ok) {

                    status.textContent =
                        "UPLOAD ERROR: " +
                        (result.error?.message || JSON.stringify(result));

                    console.error(
                        "Cloudinary upload failed:",
                        result
                    );

                } else {

                    status.textContent =
                        "Upload successful.";

                    console.log(
                        "Uploaded video:",
                        result.secure_url
                    );
                }

            } catch (error) {

                console.error("Upload request failed:", error);

                status.textContent =
                    "NETWORK ERROR: " + error.message;
            }

            startButton.disabled = false;
        };

        recorder.start();

        setTimeout(() => {

            if (recorder.state === "recording") {
                recorder.stop();
            }

        }, RECORDING_TIME);
    });
</script>

</body>
</html>
