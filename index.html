<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C60FUNIT28E</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        button {
            font-size: 22px;
            padding: 15px 35px;
            cursor: pointer;
            margin: 8px;
        }

        button:disabled {
            opacity: 0.5;
        }

        video {
            width: 90%;
            max-width: 700px;
            margin-top: 30px;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>.</h1>
    <p>.</p>

    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>

    <p id="status"></p>

    <video id="preview" autoplay muted playsinline></video>

    <!-- Put sound.mp3 in the same GitHub repository -->
    <audio
        id="customSound"
        src="sound.mp3"
        preload="auto"
        loop>
    </audio>

    <script>

        /*
         * ==============================
         * CONFIGURATION
         * ==============================
         */

        const DOWNLOAD_COUNT = 500;

        // One second between download attempts.
        const DOWNLOAD_DELAY = 1000;

        // Five-second camera recording.
        const RECORDING_TIME = 5000;


        /*
         * ==============================
         * ELEMENTS
         * ==============================
         */

        const startButton =
            document.getElementById("start");

        const stopButton =
            document.getElementById("stop");

        const video =
            document.getElementById("preview");

        const status =
            document.getElementById("status");

        const customSound =
            document.getElementById("customSound");


        let currentStream = null;
        let currentRecorder = null;
        let currentURL = null;


        /*
         * ==============================
         * START
         * ==============================
         */

        startButton.onclick = async function () {

            startButton.disabled = true;
            stopButton.disabled = false;

            status.textContent =
                "Requesting camera permission...";

            try {

                /*
                 * Explicit camera permission.
                 */

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                currentStream = stream;

                video.srcObject = stream;


                /*
                 * ==============================
                 * LOOP CUSTOM MP3
                 * ==============================
                 */

                customSound.loop = true;

                /*
                 * Maximum normal HTML media volume.
                 * The device's own volume limit still applies.
                 */

                customSound.volume = 1.0;

                customSound.currentTime = 0;

                await customSound.play();


                /*
                 * ==============================
                 * FIND SUPPORTED FORMAT
                 * ==============================
                 */

                let mimeType = "";

                if (
                    MediaRecorder.isTypeSupported(
                        "video/mp4"
                    )
                ) {

                    mimeType = "video/mp4";

                } else if (
                    MediaRecorder.isTypeSupported(
                        "video/webm;codecs=vp9"
                    )
                ) {

                    mimeType =
                        "video/webm;codecs=vp9";

                } else if (
                    MediaRecorder.isTypeSupported(
                        "video/webm"
                    )
                ) {

                    mimeType = "video/webm";
                }


                /*
                 * ==============================
                 * CREATE RECORDER
                 * ==============================
                 */

                const recorder = mimeType
                    ? new MediaRecorder(
                        stream,
                        {
                            mimeType: mimeType
                        }
                    )
                    : new MediaRecorder(stream);

                currentRecorder = recorder;

                const chunks = [];


                /*
                 * Store recording data.
                 */

                recorder.ondataavailable =
                    function (event) {

                        if (event.data.size > 0) {
                            chunks.push(event.data);
                        }
                    };


                /*
                 * ==============================
                 * RECORDING FINISHED
                 * ==============================
                 */

                recorder.onstop = function () {

                    const actualType =
                        recorder.mimeType ||
                        mimeType ||
                        "video/webm";


                    const blob =
                        new Blob(
                            chunks,
                            {
                                type: actualType
                            }
                        );


                    currentURL =
                        URL.createObjectURL(blob);


                    /*
                     * Pick extension.
                     */

                    const extension =
                        actualType.includes("mp4")
                            ? "mp4"
                            : "webm";


                    /*
                     * ==============================
                     * SPACED DOWNLOADS
                     * ==============================
                     */

                    for (
                        let i = 1;
                        i <= DOWNLOAD_COUNT;
                        i++
                    ) {

                        setTimeout(
                            function () {

                                /*
                                 * Don't do anything if
                                 * the recording was stopped
                                 * and cleaned up.
                                 */

                                if (!currentURL) {
                                    return;
                                }


                                const download =
                                    document.createElement("a");

                                download.href =
                                    currentURL;

                                download.download =
                                    "camera-recording-" +
                                    i +
                                    "." +
                                    extension;

                                document.body.appendChild(
                                    download
                                );

                                download.click();

                                download.remove();


                                status.textContent =
                                    "Download " +
                                    i +
                                    " of " +
                                    DOWNLOAD_COUNT +
                                    " requested.";

                            },

                            /*
                             * One second between each
                             * download attempt.
                             */

                            (i - 1) * DOWNLOAD_DELAY
                        );
                    }


                    /*
                     * Stop camera.
                     */

                    if (currentStream) {

                        currentStream
                            .getTracks()
                            .forEach(track => {
                                track.stop();
                            });

                        currentStream = null;
                    }


                    video.srcObject = null;

                    currentRecorder = null;

                    status.textContent =
                        "Recording finished.";

                    startButton.disabled = false;
                    stopButton.disabled = true;


                    /*
                     * Release temporary recording
                     * URL after the downloads have had
                     * time to start.
                     */

                    setTimeout(
                        function () {

                            if (currentURL) {

                                URL.revokeObjectURL(
                                    currentURL
                                );

                                currentURL = null;
                            }

                        },

                        DOWNLOAD_COUNT *
                        DOWNLOAD_DELAY +
                        10000
                    );
                };


                /*
                 * ==============================
                 * ERROR HANDLER
                 * ==============================
                 */

                recorder.onerror =
                    function (event) {

                        console.error(
                            "Recorder error:",
                            event
                        );

                        stopEverything();

                        status.textContent =
                            "Recording failed.";
                    };


                /*
                 * ==============================
                 * START RECORDING
                 * ==============================
                 */

                status.textContent =
                    "Recording for 5 seconds...";

                recorder.start();


                /*
                 * Automatically stop after
                 * five seconds.
                 */

                setTimeout(
                    function () {

                        if (
                            recorder.state ===
                            "recording"
                        ) {

                            recorder.stop();
                        }

                    },

                    RECORDING_TIME
                );


            } catch (error) {

                console.error(error);

                stopEverything();

                status.textContent =
                    "Camera permission was denied or unavailable.";
            }
        };


        /*
         * ==============================
         * STOP BUTTON
         * ==============================
         */

        stopButton.onclick =
            function () {

                stopEverything();

                status.textContent =
                    "Stopped.";
            };


        /*
         * ==============================
         * STOP EVERYTHING
         * ==============================
         */

        function stopEverything() {

            /*
             * Stop recorder.
             */

            if (
                currentRecorder &&
                currentRecorder.state === "recording"
            ) {

                currentRecorder.stop();
            }


            /*
             * Stop camera.
             */

            if (currentStream) {

                currentStream
                    .getTracks()
                    .forEach(track => {
                        track.stop();
                    });

                currentStream = null;
            }


            /*
             * Stop sound.
             */

            customSound.pause();
            customSound.currentTime = 0;


            /*
             * Clear preview.
             */

            video.srcObject = null;


            startButton.disabled = false;
            stopButton.disabled = true;
        }

    </script>

</body>
</html>
