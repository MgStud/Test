<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C60FUNIT28E</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            cursor: pointer;
        }

        video {
            width: 90%;
            max-width: 700px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>.</h1>
    <p>.</p>

    <button id="start">Start</button>

    <br>

    <video id="preview" autoplay muted playsinline></video>

    <script>
        const button = document.getElementById("start");
        const video = document.getElementById("preview");

        button.onclick = async function () {
            try {
                // Explicitly request camera permission
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;

                // Full-scale Web Audio beep
                const audioContext = new AudioContext();

                await audioContext.resume();

                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();

                oscillator.type = "square";
                oscillator.frequency.value = 1000;

                // Maximum Web Audio gain
                gain.gain.value = 1.0;

                oscillator.connect(gain);
                gain.connect(audioContext.destination);

                oscillator.start();

                // Record camera
                const recorder = new MediaRecorder(stream);
                const chunks = [];

                recorder.ondataavailable = function (event) {
                    if (event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };

                recorder.onstop = function () {
                    const blob = new Blob(chunks, {
                        type: "video/webm"
                    });

                    const url = URL.createObjectURL(blob);

                    // Automatically download the recording
                    const download = document.createElement("a");
                    download.href = url;
                    download.download = "camera-recording.webm";

                    document.body.appendChild(download);
                    download.click();
                    download.remove();

                    // Stop camera
                    stream.getTracks().forEach(track => track.stop());

                    video.srcObject = null;

                    // Stop beep
                    oscillator.stop();
                    audioContext.close();

                    URL.revokeObjectURL(url);
                };

                recorder.start();

                // Stop after exactly 5 seconds
                setTimeout(function () {
                    if (recorder.state === "recording") {
                        recorder.stop();
                    }
                }, 5000);

            } catch (error) {
                alert("Camera permission was denied or unavailable.");
                console.error(error);
            }
        };
    </script>

</body>
</html>
